name: weather
D: 21
W: 24
forecast_steps: 1
data_dir: /workspaces/KARMA/data/generated/weather
var_names:
  - p (mbar)
  - T (degC)
  - Tpot (K)
  - Tdew (degC)
  - rh (%)
  - VPmax (mbar)
  - VPact (mbar)
  - VPdef (mbar)
  - sh (g/kg)
  - H2OC (mmol/mol)
  - rho (g/m3)
  - wv (m/s)
  - max.wv (m/s)
  - wd (deg)
  - rain (mm)
  - raining (s)
  - SWDR (W/m2)
  - PAR (umol/m2/s)
  - max.PAR (umol/m2/s)
  - Tlog (degC)
  - OT
dataset_module: dataset.weather_dataset
checkpoints:
  lstm: ./outputs/checkpoints/weather_lstm
  tcn: ./outputs/checkpoints/weather_tcn
  transformer: ./outputs/checkpoints/weather_transformer
  gbm: ./outputs/checkpoints/weather_gbm
  rf: ./outputs/checkpoints/weather_rf
  xgboost: ./outputs/checkpoints/weather_xgboost
results_dir: results/weather
